; tox.ini — canonical config shipped with tomte.
;
; Consumers do not edit or copy this file. They run `tomte tox -e <env>`
; from the repo root; the wrapper reads `[tool.tomte]` from the repo's
; pyproject.toml, optionally pulls extra deps / pylint flags from a small
; local `[tomte-extensions]` section, renders this template into a temp
; tox.ini and invokes tox against it.
;
; Substitution variables (filled by `tomte tox` at runtime):
;   $$TOMTE_VERSION                 e.g. 0.7.0
;   $$OPEN_AUTONOMY_VERSION         e.g. 0.21.19
;   $$OPEN_AEA_VERSION              e.g. 2.2.1
;   $$PACKAGES_PATHS                e.g. packages/valory
;   $$SKILLS_PATHS                  e.g. packages/valory/skills
;   $$SERVICE_SPECIFIC_PACKAGES     space-separated list of dirs
;   $$KNOWN_FIRST_PARTY             isort known_first_party (e.g. autonomy)
;   $$SERVICE_PUBLIC_ID             e.g. valory/mech (used by analyse-service)
;   $$PYTEST_TARGETS                space-separated pytest paths
;   $$EXTRA_DEPS_PACKAGES           multi-line; from [tomte-extensions].extra_deps
;   $$EXTRA_TESTENVS                multi-line; from [tomte-extensions].extra_testenvs
;   $$UPSTREAM_PINS                 inline --upstream args for check-third-party-hashes
;   $$EXTRA_PYLINT_FLAGS            pre-rendered pylint extension CLI flags
;                                   (e.g. "--ignored-modules=web3 --disable=C0111"),
;                                   or empty when no extras declared
;   $$CHECK_HANDLERS_IGNORES        check-handlers `-i pkg` ignore flags
;   $$TOMTE_DEP_PIN                 PEP 508 spec right of `tomte[<extras>]`,
;                                   typically `==0.7.0` or ` @ git+...`
;
; Per-repo `[mypy-<lib>]` overrides are read directly from the consuming
; repo's `tox.ini` at testenv runtime by `tomte render-mypy-config
; --append-from=tox.ini` — they are NOT substituted into this template.

[tox]
envlist = bandit, safety, black, black-check, isort, isort-check, check-hash, check-packages, check-dependencies, flake8, mypy, pylint, darglint, check-abciapp-specs, check-abci-docstrings, check-handlers, check-generate-all-protocols, coverage, py{3.10,3.11,3.12,3.13,3.14}-{linux,darwin,win}
skip_missing_interpreters = true
isolated_build = True
; tox-uv: seed venvs with pip (autonomy CLI imports pip._internal)
uv_seed = true

[deps-tests]
deps =
    pip
    tomte[tests]$TOMTE_DEP_PIN

[deps-packages]
deps =
    {[deps-tests]deps}
    open-autonomy[all]==$OPEN_AUTONOMY_VERSION
    open-aea-ledger-ethereum==$OPEN_AEA_VERSION
    open-aea-ledger-cosmos==$OPEN_AEA_VERSION
    open-aea-test-autonomy==$OPEN_AUTONOMY_VERSION
    open-aea-cli-ipfs==$OPEN_AEA_VERSION
    open-aea-helpers==$OPEN_AUTONOMY_VERSION
$EXTRA_DEPS_PACKAGES

[testenv]
allowlist_externals = /bin/sh
deps = {[deps-packages]deps}
passenv = *
setenv =
    UV_PRERELEASE=allow
    PYTHONHASHSEED=0
    PYTHONPATH={env:PWD:%CD%}
    PACKAGES_PATHS = $PACKAGES_PATHS
    SKILLS_PATHS = $SKILLS_PATHS
    SERVICE_SPECIFIC_PACKAGES = $SERVICE_SPECIFIC_PACKAGES
commands =
    autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    autonomy packages sync
    pytest -rfE $PYTEST_TARGETS --cov-report=xml --cov-report=term --cov-report=term-missing --cov-config=.coveragerc {posargs}

[testenv:py{3.10,3.11,3.12,3.13,3.14}-linux]
platform = ^linux$$

[testenv:py{3.10,3.11,3.12,3.13,3.14}-darwin]
platform = ^darwin$$

[testenv:py{3.10,3.11,3.12,3.13,3.14}-win]
platform = ^win32$$

; -- linters --------------------------------------------------------------

[testenv:bandit]
skipsdist = True
skip_install = True
deps = tomte[bandit]$TOMTE_DEP_PIN
commands =
    bandit -c {envsitepackagesdir}/tomte/configs/bandit.yaml -r {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:black]
skipsdist = True
skip_install = True
deps = tomte[black]$TOMTE_DEP_PIN
commands = black {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:black-check]
skipsdist = True
skip_install = True
deps = tomte[black]$TOMTE_DEP_PIN
commands = black --check {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:isort]
skipsdist = True
skip_install = True
deps = tomte[isort,cli]$TOMTE_DEP_PIN
commands_pre = tomte render-isort-config --output={envtmpdir}/isort.cfg --known-first-party=$KNOWN_FIRST_PARTY --known-packages=packages --known-local-folder=tests
commands = isort --gitignore --settings-path={envtmpdir}/isort.cfg {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:isort-check]
skipsdist = True
skip_install = True
deps = tomte[isort,cli]$TOMTE_DEP_PIN
commands_pre = tomte render-isort-config --output={envtmpdir}/isort.cfg --known-first-party=$KNOWN_FIRST_PARTY --known-packages=packages --known-local-folder=tests
commands = isort --check-only --gitignore --settings-path={envtmpdir}/isort.cfg {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:flake8]
skipsdist = True
skip_install = True
deps = tomte[flake8]$TOMTE_DEP_PIN
commands =
    flake8 --config={envsitepackagesdir}/tomte/configs/flake8.cfg \
        {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:mypy]
skipsdist = True
skip_install = True
deps =
    pip
    tomte[mypy,cli]$TOMTE_DEP_PIN
commands_pre = tomte render-mypy-config --output={envtmpdir}/mypy.ini --append-from=tox.ini
commands = mypy --config-file={envtmpdir}/mypy.ini --disallow-untyped-defs {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:pylint]
skipsdist = True
deps =
    {[deps-packages]deps}
    tomte[pylint]$TOMTE_DEP_PIN
commands =
    pylint --rcfile={envsitepackagesdir}/tomte/configs/pylintrc \
        --ignore-paths="^packages/valory/.*$$" $EXTRA_PYLINT_FLAGS \
        {env:SERVICE_SPECIFIC_PACKAGES}

[testenv:darglint]
; darglint has no --config-file flag; settings live in [darglint] at
; the bottom of this tox.ini.
skipsdist = True
skip_install = True
deps = tomte[darglint]$TOMTE_DEP_PIN
commands =
    darglint {env:SERVICE_SPECIFIC_PACKAGES}/*

[testenv:safety]
skipsdist = True
skip_install = True
; httpx 0.28 dropped `NetworkError`; safety 3.7.0's event-handler imports it.
deps =
    httpx<0.28
    tomte[safety]$TOMTE_DEP_PIN
commands =
    safety check --policy-file {envsitepackagesdir}/tomte/configs/safety-policy.yml

; -- autonomy / aea checks -----------------------------------------------

[testenv:check-hash]
skipsdist = True
usedevelop = True
deps =
    pip
    open-autonomy[all]==$OPEN_AUTONOMY_VERSION
commands =
    autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    autonomy packages sync
    autonomy packages lock --check

[testenv:check-packages]
skipsdist = True
usedevelop = True
deps = {[deps-packages]deps}
commands =
    autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    autonomy packages sync
    autonomy check-packages

[testenv:check-dependencies]
skipsdist = True
usedevelop = True
commands =
    autonomy packages sync
    aea-helpers check-dependencies --check --tox {toxinidir}/.tomte-tox.ini --exclude requests --exclude pyyaml --exclude PyYAML $CHECK_DEPENDENCIES_EXTRA_EXCLUDES

[testenv:check-third-party-hashes]
skipsdist = True
skip_install = True
deps =
    open-aea==$OPEN_AEA_VERSION
    open-aea-ci-helpers==$OPEN_AEA_VERSION
commands =
    aea-ci check-third-party-hashes $UPSTREAM_PINS

[testenv:check-abciapp-specs]
skipsdist = True
usedevelop = True
commands =
    autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    autonomy packages sync --third-party
    autonomy analyse fsm-specs

[testenv:check-generate-all-protocols]
skipsdist = True
usedevelop = True
deps =
    {[deps-packages]deps}
    tomte[isort]$TOMTE_DEP_PIN
    tomte[black]$TOMTE_DEP_PIN
commands = autonomy generate-all-protocols --check-clean

[testenv:abci-docstrings]
skipsdist = True
usedevelop = True
commands = autonomy analyse docstrings --update

[testenv:check-abci-docstrings]
skipsdist = True
usedevelop = True
commands = autonomy analyse docstrings

[testenv:check-handlers]
skipsdist = True
usedevelop = True
deps =
    pip
    open-autonomy[all]==$OPEN_AUTONOMY_VERSION
commands =
    autonomy analyse handlers -h abci -h http -h contract_api -h ledger_api -h signing $CHECK_HANDLERS_IGNORES

[testenv:check-doc-hashes]
skipsdist = True
skip_install = True
commands =
    aea init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    aea packages sync
    aea-helpers check-doc-hashes

[testenv:fix-doc-hashes]
skipsdist = True
skip_install = True
commands = aea-helpers check-doc-hashes --fix

[testenv:liccheck]
; liccheck imports pkg_resources from setuptools. tox-uv strips
; setuptools by default; setuptools 81+ removed pkg_resources.
skipsdist = True
usedevelop = True
deps =
    pip
    setuptools<81
    tomte[liccheck,cli]$TOMTE_DEP_PIN
commands =
    tomte freeze-dependencies --output-path {envtmpdir}/requirements.txt
    liccheck -s {toxinidir}/.tomte-tox.ini -r {envtmpdir}/requirements.txt -l PARANOID

[testenv:analyse-service]
skipsdist = True
usedevelop = True
commands = autonomy analyse service --public-id $SERVICE_PUBLIC_ID --skip-warnings

[testenv:coverage]
; Coverage run for codecov upload. Pinned to py3.14-linux to keep the
; report deterministic across PRs. Mirrors the matrix py3.X-linux test
; commands but is invoked as a single env outside the matrix.
basepython = python3.14
platform = ^linux$$
skipsdist = True
usedevelop = True
deps = {[deps-packages]deps}
commands =
    autonomy init --reset --author ci --remote --ipfs --ipfs-node "/dns/registry.autonolas.tech/tcp/443/https"
    autonomy packages sync
    pytest -rfE $PYTEST_TARGETS --cov-report=xml --cov-report=term --cov-report=term-missing {posargs}

[testenv:gitleaks]
; Secret-scan env. Wraps the gitleaks binary (must be on PATH) with the
; canonical ruleset, optionally extended by per-repo `gitleaks_extra_paths`
; in [tool.tomte]. The wrapper writes `.gitleaks-merged.toml` next to the
; rendered tox.ini at runtime; this env just invokes gitleaks against it.
skipsdist = True
skip_install = True
allowlist_externals = gitleaks
commands =
    gitleaks detect --config={toxinidir}/.gitleaks-merged.toml --report-format json --report-path leak_report -v

$EXTRA_TESTENVS

; darglint config is rendered as a `.darglint` file in the repo root by
; the `tomte tox` wrapper at runtime (darglint has no `--config-file` flag
; and only discovers config in CWD by filename). The wrapper cleans it up
; on exit unless the consumer ships their own `.darglint`.

; Per-repo `[mypy*]` overrides are not substituted here — `tomte
; render-mypy-config --append-from=tox.ini` reads them at testenv
; runtime from the consuming repo's tox.ini.

