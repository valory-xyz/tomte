# Canonical isort base. Per-repo `known_first_party` /
# `known_packages` / `known_local_folder` are NOT shipped here —
# consumers concat them on at runtime via the [testenv:isort]
# `commands_pre` step.

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
order_by_type = False
case_sensitive = True
lines_after_imports = -1
skip_glob = **/*_pb2.py
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,PACKAGES,LOCALFOLDER
