# Canonical isort config shipped by tomte.
#
# Repos consume this via:
#   isort --settings-path=$(python -c "import tomte.configs as c; print(c.isort_cfg())") <paths>
#
# Per-repo first-party names (e.g. open-aea uses `aea`, open-autonomy
# uses `autonomy`) override `known_first_party` via a local .isort.cfg
# OR by passing `--known-first-party=<name>` on the CLI. Recommended:
# pass on the CLI from the tox env so this canonical stays untouched.

[settings]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

# Custom Valory section ordering — agent repos colocate `packages/` as a
# distinct namespace separate from FIRSTPARTY (the framework code).
order_by_type = False
case_sensitive = True
lines_after_imports = -1

skip_glob = **/*_pb2.py

# Per-repo overrides:
#   known_first_party=<repo's framework module, e.g. aea / autonomy>
known_packages = packages
known_local_folder = tests
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,PACKAGES,LOCALFOLDER
