# Canonical isort base shipped by tomte.
#
# This is a *base* — per-repo packaging facts (`known_first_party`,
# `known_packages`, `known_local_folder`) are NOT enumerated here. Per
# David's review on `valory-xyz/tomte#46`, tomte must not encode
# downstream identity. Each consumer concat-tricks its overrides on top:
#
#   [testenv:isort]
#   commands_pre =
#       python -c "from tomte.configs import ISORT_CFG; from pathlib import Path; Path(r'{envtmpdir}/isort.cfg').write_text(ISORT_CFG.read_text() + '\nknown_first_party = <repo>\nknown_packages = packages\nknown_local_folder = tests\n')"
#   commands = isort --settings-path={envtmpdir}/isort.cfg ...

[settings]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
order_by_type = False
case_sensitive = True
lines_after_imports = -1
skip_glob = **/*_pb2.py
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,PACKAGES,LOCALFOLDER
