# Canonical flake8 base. Per-repo `application-import-names`,
# `per-file-ignores`, and any extra excludes are appended via the
# [testenv:flake8] command_pre concat trick on each consumer.

[flake8]
max-line-length = 88
select = B,C,D,E,F,I,W
ignore = E203,E501,W503,D202,B014,D400,D401,DAR,B028,B017,B042,I001,I005

# Generic excludes — protobuf-generated code carries flake8 violations
# the consumers cannot fix (the generator emits commented code, unused
# imports, stale-syntax shims, etc.). Per-repo additions go in the
# consuming tox env via concat.
exclude = .git,__pycache__,build,dist,*.egg-info,*_pb2.py,*_pb2_grpc.py
