# Canonical flake8 config shipped by tomte.
#
# Repos consume this via:
#   flake8 --config=$(python -c "import tomte.configs as c; print(c.flake8_cfg())") <paths>
#
# Per-repo `paths`, `exclude`, `application-import-names`, and
# `per-file-ignores` are appended via a local .flake8 next to this one
# only when needed. Most agent repos can use this canonical as-is.

[flake8]
max-line-length = 88

# Selected:
# B = bugbear, C = comprehensions/complexity, D = pydocstyle,
# E = pycodestyle errors, F = pyflakes, I = imports, W = warnings.
select = B,C,D,E,F,I,W

# Ignored:
# E203 / E501: handled by black (whitespace before punctuation, line length)
# W503:        line break before binary operator (black-compatible)
# D202:        no blank line allowed after docstring (conflicts with black)
# D400 / D401: imperative-mood / period-at-end (too noisy)
# B014:        redundant exception types in except clause
# B017:        assertRaises(Exception)
# B028:        no-explicit-stacklevel
# B042:        get-type-error
# DAR:         darglint codes (run by darglint separately)
# I001 / I005: flake8-isort emits these when isort would change something —
#              redundant with the dedicated isort env that already runs.
ignore = E203,E501,W503,D202,B014,D400,D401,DAR,B028,B017,B042,I001,I005

# Repo-specific: provide via local .flake8
# application-import-names = <packages>,<framework>,tests,scripts
# paths = ...
# exclude = ...
# per-file-ignores = ...
