# Canonical safety policy shipped by tomte.
#
# Repos consume this via:
#   safety check --policy-file $(python -c "from tomte.configs import SAFETY_POLICY; print(SAFETY_POLICY)")
#
# The allowlist here stays empty, and not because nothing is ever ignored:
# safety 3.7.0's `check` validates `ignore-vulnerabilities` keys as positive
# integers and rejects the `SFTY-<date>-<n>` form advisories are published
# under, so a policy file cannot express a current advisory at all.
#
# Ignores are therefore passed as `--ignore` flags, rendered by `tomte tox`:
#   * the fleet baseline lives in `_FLEET_SAFETY_IGNORES` in
#     tomte/tools/tox_runtime.py, and covers advisories in the scanner's own
#     dependency tree, each justified by why the vulnerable code cannot be
#     reached from the scan
#   * a repo adds its own with `safety_ignores` in `[tool.tomte]`
#
# "No fix is available" is a reason an ignore cannot be retired yet, not a
# reason to add one. The fleet's baseline remains "fail on any unfixed CVE"
# in the repo's own dependency tree.

security:
  ignore-vulnerabilities: {}
  continue-on-vulnerability-error: false
