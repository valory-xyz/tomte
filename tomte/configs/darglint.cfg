# Canonical darglint config shipped by tomte.
#
# Repos consume this via:
#   darglint --config-file=$(python -c "from tomte.configs import DARGLINT_CFG; print(DARGLINT_CFG)") <paths>
#
# Sphinx docstring style, short strictness — matches the OA / OAEA /
# downstream convention without quibbling over single-line vs multi-line
# return descriptions.

[darglint]
docstring_style = sphinx
strictness = short
; `async_act` is the AEA convention name for behaviour generators; their
; bodies aren't hand-documented because the framework owns the contract.
; `*_pb2.py` is generated protobuf code, never docstring'd.
ignore_regex = async_act|.*_pb2\.py
ignore = DAR401
