; Canonical mypy config shipped by tomte.
;
; Repos consume this via the canonical [testenv:mypy] in
; tomte/templates/tox.ini.template — which concatenates this file with
; the consuming repo's tox.ini at runtime and points mypy at the merged
; result. Mypy reads only `[mypy*]` sections from any ini-format file,
; so concatenating tox.ini (which is also ini-format) lets repo-specific
; `[mypy-foo.*]` sections layer cleanly on top of the fleet defaults.
;
; The lists below are the *fleet union* across every Valory repo
; surveyed 2026-04 (open-autonomy, open-aea, mech, mech-predict,
; mech-interact, mech-agents-fun, mech-server, mech-client, meme-ooorr,
; IEKit, optimus, trader, market-creator). Entries that don't match an
; actual import in a given repo are no-ops, so over-listing is
; harmless. Adding a new transitive dep without type stubs across the
; fleet? Edit this file once, bump tomte, all repos pick it up.
;
; What stays per-repo (and therefore in that repo's tox.ini, *not*
; here): `[mypy-packages.valory.skills.<name>.*] ignore_errors = True`
; for vendored skills the repo doesn't own. Ownership-dependent — open-
; autonomy MUST type-check `abstract_round_abci`, every downstream MUST
; ignore it. That's the ~5–15 lines of legitimate per-repo mypy state
; under David's "tox more expanded" model.

[mypy]
python_version = 3.10
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = False
ignore_missing_imports = False
follow_imports = normal
; Generated protobuf code is never type-checked. The pattern matches
; foo_pb2.py / foo_pb2_grpc.py / foo/custom_types.py across packages/.
exclude = (.*_pb2(_grpc)?\.py|.*custom_types\.py)$

; -- third-party deps without type stubs (fleet union) -------------------

[mypy-_pytest.*,_strptime.*,attr.*,coverage.*,docker.*,docstring_parser,git.*,google.*,google.protobuf.*,googleapiclient.*,grpc.*,hypothesis.*,mistune,multidict.*,numpy,packaging.*,pandas.*,psutil,pytest,pytest_asyncio.*,pywintypes.*,sqlalchemy,statsmodels.*,temper.*,tensorflow.*,toml.*,tqdm,tqdm.*,urllib3.*,win32con.*,win32file.*,yaml]
ignore_missing_imports = True

[mypy-bech32.*,certifi.*,connexion,click.*,cosmpy.*,Crypto.*,defusedxml.*,dotenv,dotenv.*]
ignore_missing_imports = True

; -- AEA / Open-Autonomy framework deps ----------------------------------

[mypy-aea.*,aea_cli_ipfs.*,aea_ledger_ethereum.*,aea_ledger_ethereum_hwi.*,aea_ledger_cosmos.*,aea_ledger_fetchai.*,aea_ledger_solana.*,aea_test_autonomy.*,autonomy.*]
ignore_missing_imports = True

; -- web3 / Ethereum stack ----------------------------------------------

[mypy-eth_abi.*,eth_account.*,eth_keys.*,eth_typing.*,eth_utils.*,hexbytes.*,py_ecc.*,py_eth_sig_utils.*,solana,solders,web3.*,open-aea-web3.*,safe_eth.*]
ignore_missing_imports = True

; -- IPFS / multiaddr ----------------------------------------------------

[mypy-ipfshttpclient.*,multibase.*,multicodec.*]
ignore_missing_imports = True

; -- HTTP / web stack ----------------------------------------------------

[mypy-aiohttp,aiohttp.*,flask,flask.*,requests,requests.*,websocket.*,werkzeug,werkzeug.*]
ignore_missing_imports = True

; -- AI / model libraries ------------------------------------------------

[mypy-anthropic.*,bs4.*,docstring_parser,faiss,factcheck.*,langchain.*,langchain_community.*,langchain_core.*,langchain_openai.*,langchain_tavily.*,langgraph.*,markdownify,mech_client.*,moviepy.*,openai.*,peewee.*,prediction_market_agent_tooling.*,pydantic,pydantic.*,PyPDF2,readability,replicate.*,sentence_transformers.*,tiktoken.*,tweepy.*]
ignore_missing_imports = True

; -- runtime infra -------------------------------------------------------

[mypy-pebble,pebble.*,prometheus_client,prometheus_client.*,operate.*,operate.cli.*,oef.*,PIL.*,gql.*]
ignore_missing_imports = True
