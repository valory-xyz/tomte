; Canonical mypy config shipped by tomte.
;
; This is a *base* — it carries mypy global flags and a generic
; file-pattern exclude (protobuf-generated code), but **no downstream
; library names**. Listing third-party libs here would force a tomte
; release every time a consumer repo adds a new transitive dep without
; type stubs, which is the wrong dependency direction.
;
; Repos consume this via the canonical [testenv:mypy] in
; tomte/templates/tox.ini.template — `commands_pre` concatenates this
; file with the consuming repo's tox.ini at runtime and points mypy at
; the merged result. Mypy reads `[mypy*]` sections from any ini-format
; file, so any `[mypy-<libname>]` section the repo puts in its own
; tox.ini layers cleanly on top.
;
; What lives in each repo's tox.ini (NOT here):
;   * [mypy-<thirdparty>] ignore_missing_imports = True
;     for every third-party dep that lacks type stubs in that repo.
;   * [mypy-packages.valory.skills.<name>.*] ignore_errors = True
;     for vendored skills the repo doesn't own — ownership-dependent
;     (open-autonomy MUST type-check `abstract_round_abci`; every
;     downstream MUST ignore it).

[mypy]
python_version = 3.10
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = False
ignore_missing_imports = False
follow_imports = normal
; Generated protobuf code is never type-checked. The pattern matches
; foo_pb2.py / foo_pb2_grpc.py / foo/custom_types.py across packages/.
exclude = (.*_pb2(_grpc)?\.py|.*custom_types\.py)$
