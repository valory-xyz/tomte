; Canonical mypy base. Per-repo `[mypy-<lib>]` overrides live in each
; consumer's tox.ini and layer onto this file via the [testenv:mypy]
; `commands_pre` concat step.

[mypy]
python_version = 3.10
strict_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = False
ignore_missing_imports = False
follow_imports = normal
; `packages/` is namespaced (no __init__.py at the author level); enable
; namespace package handling and explicit base detection so mypy walks
; `packages/<author>/<type>/<name>/...` correctly.
namespace_packages = True
explicit_package_bases = True
; Generated protobuf code is never type-checked. The pattern matches
; foo_pb2.py / foo_pb2_grpc.py / foo/custom_types.py across packages/.
exclude = (.*_pb2(_grpc)?\.py|.*custom_types\.py)$

; ---------------------------------------------------------------------------
; Per-module overrides for libraries that don't ship type stubs. These were
; previously duplicated across every consuming repo's tox.ini; centralising
; here keeps repo-local tox.ini reserved for truly repo-specific overrides
; (e.g. `packages.valory.skills.<name>.* ignore_errors`).
; ---------------------------------------------------------------------------

; -- AEA / autonomy ecosystem --
[mypy-aea.*]
ignore_missing_imports = True

[mypy-aea_test_autonomy.*]
ignore_missing_imports = True

[mypy-aea_ledger_ethereum.*]
ignore_missing_imports = True

[mypy-aea_cli_ipfs.*]
ignore_missing_imports = True

[mypy-autonomy.*]
ignore_missing_imports = True

; -- Pytest / testing --
[mypy-pytest]
ignore_missing_imports = True

[mypy-_pytest.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True

; -- HTTP / TLS / serialization --
[mypy-requests]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-certifi.*]
ignore_missing_imports = True

; -- Common third-party libs without stubs --
[mypy-web3.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-click.*]
ignore_missing_imports = True

[mypy-pebble.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-tiktoken.*]
