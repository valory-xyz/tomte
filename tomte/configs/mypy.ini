; -- OA-ecosystem packages namespace (third-party packages synced from IPFS
; are not lint-clean; consumers should still add specific ignores for
; first-party-but-not-yet-clean packages in their own tox.ini). --
[mypy-packages.open_aea.*]
ignore_errors = True

[mypy-packages.fetchai.*]
ignore_errors = True
