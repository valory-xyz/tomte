name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: pipx install poetry==2.1.4
      - name: Install dev deps
        run: poetry install --all-extras --with dev
      - name: Run pytest
        run: poetry run pytest -q --ignore=tests/test_check_doc_links.py --ignore=tests/test_check_readme.py

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Verify no dependency failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi
